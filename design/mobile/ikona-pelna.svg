<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Tło na pełną powierzchnię (maskable, iOS): bez zaokrągleń i przezroczystości -->
  <rect width="512" height="512" fill="url(#bgDark)" />

  <!-- Neonowe koła w tle dla efektu głębi -->
  <circle cx="160" cy="160" r="120" fill="#6366F1" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="350" cy="350" r="100" fill="#10B981" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Nowoczesny motyw zintegrowanej linii budżetu i portfela -->
  <g filter="url(#neonGlow)">
    <!-- Zewnętrzna rama portfela -->
    <rect x="116" y="136" width="280" height="240" rx="44" fill="none" stroke="url(#neonPurple)" stroke-width="16" />

    <!-- Linia trendu przechodząca przez środek -->
    <path d="M 150 280 L 220 280 L 270 210 L 320 240 L 360 180" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Strzałka sukcesu finansowego -->
    <path d="M 340 180 H 360 V 200" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
